<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

.box{
background:white;
padding:40px;
border-radius:20px;
width:650px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h2{
margin-bottom:10px;
color:#333;
}

p{
color:#555;
margin-bottom:15px;
}

textarea{
width:100%;
height:300px;
padding:12px;
font-size:15px;
border-radius:10px;
border:1px solid #ccc;
resize:none;
}

button{
margin-top:15px;
padding:12px;
width:100%;
background:#28a745;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>{{ q }} ({{ company }})</h2>
<p>{{ desc }}</p>

<form method="post">
<textarea name="answer" placeholder="Write your code here..."></textarea>
<button>Submit Answer</button>
</form>

</div>

</body>
</html>
